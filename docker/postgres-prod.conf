# Configuration PostgreSQL optimisée pour Raspberry Pi 4 (2GB RAM)
# Fichier : /etc/postgresql/postgresql.conf

# =================================================================
# CONNEXIONS
# =================================================================
max_connections = 30                    # Réduit pour économiser la RAM
shared_buffers = 128MB                  # ~25% de RAM disponible pour PostgreSQL (512MB)
effective_cache_size = 384MB            # ~75% de shared_buffers

# =================================================================
# MÉMOIRE
# =================================================================
work_mem = 4MB                          # Mémoire par opération de tri/hash
maintenance_work_mem = 32MB             # Mémoire pour VACUUM, CREATE INDEX
temp_buffers = 8MB                      # Buffers temporaires par session

# =================================================================
# WRITE AHEAD LOG (WAL)
# =================================================================
wal_buffers = 4MB
min_wal_size = 80MB
max_wal_size = 256MB
checkpoint_completion_target = 0.9

# =================================================================
# PERFORMANCES QUERY
# =================================================================
random_page_cost = 1.1                  # SSD/SD Card rapide
effective_io_concurrency = 200          # Pour SSD

# =================================================================
# LOGGING
# =================================================================
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000       # Log les requêtes > 1s
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_timezone = 'Europe/Paris'

# =================================================================
# AUTOVACUUM (important pour les petits systèmes)
# =================================================================
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 60s

# =================================================================
# LOCALE
# =================================================================
datestyle = 'iso, dmy'
timezone = 'Europe/Paris'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'fr_FR.UTF-8'
lc_numeric = 'fr_FR.UTF-8'
lc_time = 'fr_FR.UTF-8'
default_text_search_config = 'pg_catalog.french'
