name: projetl2a

services:
  # ================= DATABASE =================
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mon_user
      POSTGRES_PASSWORD: mon_pass
      POSTGRES_DB: ma_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mon_user -d ma_db"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ================= FLASK BACKEND =================
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend/Dockerfile
      args:
        - BUILD_ENV=dev
    volumes:
      - ../backend:/app
    ports:
      - "5000:5000"
    environment:
      POSTGRES_USER: mon_user
      POSTGRES_PASSWORD: mon_pass
      POSTGRES_DB: ma_db
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://mon_user:mon_pass@db/ma_db
      FLASK_ENV: development
    depends_on:
      db:
        condition: service_healthy
    command: flask --app app run --host=0.0.0.0 --port=5000

  # ================= WEBSOCKET SERVER (Node.js) =================
  ws-server:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../backend:/app
    ports:
      - "3001:3001"
    command: sh -c "npm install && node gameServeur.js"
    depends_on:
      - backend
    restart: unless-stopped

  # ================= FRONTEND =================
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend/Dockerfile
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - yarn_cache:/usr/local/share/.cache/yarn
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      - BACKEND_PROXY=http://backend:5000
      - VITE_WS_PORT=3001
    command: sh -c "yarn install && yarn dev --host 0.0.0.0"
    depends_on:
      - backend
      - ws-server

volumes:
  db_data:
  frontend_node_modules:
  yarn_cache:

networks:
  default:
    name: fullstack_network
