version: '3.8'

name: projetl2a

services:
  # Base de données
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mon_user
      POSTGRES_PASSWORD: mon_pass
      POSTGRES_DB: ma_db
    volumes:
      # Monte le dossier du projet (pas celui dans docker/) pour persister les données
      - ../backend/db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # Optionnel : pour se connecter avec DBeaver
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mon_user -d ma_db"]
      interval: 10s
      timeout: 5s
      retries: 3

# Backend Flask
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend/Dockerfile
    volumes:
      - ../backend:/app
    ports:
      - "5000:5000"
    environment:
      # Variables explicites pour que backend/app.py puisse se connecter
      POSTGRES_USER: mon_user
      POSTGRES_PASSWORD: mon_pass
      POSTGRES_DB: ma_db
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Garder DATABASE_URL pour compatibilité côté app si nécessaire
      DATABASE_URL: postgresql://mon_user:mon_pass@db/ma_db
      FLASK_ENV: development
    depends_on:
      db:
        condition: service_healthy  # Attend que la DB soit prête
    command: flask run --host=0.0.0.0 --port=5000

# Frontend React/Vite avec YARN
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend/Dockerfile
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - yarn_cache:/usr/local/share/.cache/yarn  # Cache yarn persistant !
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0  # Pas de confirmation pour yarn
      - BACKEND_PROXY=http://backend:5000  # Configure le proxy Vite vers le backend Docker
    command: sh -c "yarn install && yarn dev --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  frontend_node_modules:  # Important pour les perfs !
  yarn_cache:  # Accélère les rebuild !

networks:
  default:  # Réseau créé automatiquement
    name: fullstack_network