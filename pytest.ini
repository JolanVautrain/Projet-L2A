[pytest]
# Configuration pytest pour le projet L2A
asyncio_mode = auto
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers -W ignore::DeprecationWarning
markers =
    asyncio: marks tests as asyncio (deselect with '-m "not asyncio"')

# Ignorer les warnings de DeprecationWarning (python 3.14+ utilise des APIs dépréciées)
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio
    ignore::DeprecationWarning:asyncio
    ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning
    ignore:.*asyncio.get_event_loop_policy.*:DeprecationWarning
    ignore:.*asyncio.set_event_loop_policy.*:DeprecationWarning

