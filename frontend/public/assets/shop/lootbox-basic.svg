<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background glow -->
  <circle cx="64" cy="64" r="58" fill="url(#glowBasic)" opacity="0.2"/>
  
  <!-- Box body -->
  <rect x="32" y="48" width="64" height="48" rx="4" fill="url(#boxGradient)"/>
  <rect x="32" y="48" width="64" height="48" rx="4" stroke="#4a5568" stroke-width="2"/>
  
  <!-- Ribbon vertical -->
  <rect x="60" y="38" width="8" height="68" fill="#fbbf24"/>
  <rect x="60" y="38" width="8" height="68" fill="url(#ribbonShine)" opacity="0.4"/>
  
  <!-- Ribbon horizontal -->
  <rect x="28" y="68" width="72" height="8" fill="#fbbf24"/>
  <rect x="28" y="68" width="72" height="8" fill="url(#ribbonShine)" opacity="0.4"/>
  
  <!-- Lock icon -->
  <circle cx="64" cy="72" r="8" fill="#6b7280"/>
  <rect x="62" y="72" width="4" height="8" fill="#6b7280"/>
  
  <!-- Question mark -->
  <text x="64" y="66" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fef3c7" text-anchor="middle">?</text>
  
  <!-- Sparkles -->
  <circle cx="40" cy="42" r="2" fill="#fcd34d" opacity="0.8"/>
  <circle cx="88" cy="44" r="2" fill="#fcd34d" opacity="0.8"/>
  <circle cx="46" cy="98" r="2" fill="#fcd34d" opacity="0.8"/>
  <circle cx="82" cy="100" r="2" fill="#fcd34d" opacity="0.8"/>
  
  <defs>
    <linearGradient id="glowBasic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ribbonShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
</svg>
