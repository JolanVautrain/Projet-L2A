[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sail-weather-backend"
version = "0.1.0"
description = "Backend Flask pour Groupe 34"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["test*", "WIKI*", "docker*", "script*", "frontend*"]

[tool.black]
line-length = 79
