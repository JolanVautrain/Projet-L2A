stages:
  - test
  - build
  - push
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  # Disable TLS for docker:dind when using modern Docker images
  DOCKER_TLS_CERTDIR: ""
  COVERAGE_FAIL_UNDER: "0" # seuil de failure de couverture de code python (%)

cache:
  paths:
    - frontend/node_modules/

tests-backend:
  image: python:3.11
  stage: test
  services:
    - name: postgres:15
      alias: postgres
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_pass
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
  before_script:
    - apt-get update && apt-get install -y postgresql-client || true
    - until pg_isready -h $POSTGRES_HOST -p $POSTGRES_PORT; do echo "waiting for postgres..."; sleep 1; done
  script:
    - pip install --upgrade pip
    - pip install flake8 pytest || true
    - pip install -r backend/requirements.txt || true
    - flake8 backend || true
    - mkdir -p reports/junit reports/logs
    - pytest backend --junitxml=reports/junit/backend.xml -q 2>&1 | tee reports/logs/backend_pytest.log || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - reports/junit/backend.xml
      - reports/logs/backend_pytest.log
    reports:
      junit: reports/junit/backend.xml

coverage-backend:
  image: python:3.11
  stage: test
  services:
    - name: postgres:15
      alias: postgres
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_pass
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
  before_script:
    - apt-get update && apt-get install -y postgresql-client || true
    - until pg_isready -h $POSTGRES_HOST -p $POSTGRES_PORT; do echo "waiting for postgres..."; sleep 1; done
  script:
    - pip install --upgrade pip
    - pip install pytest pytest-cov || true
    - pip install -r backend/requirements.txt || true
    - mkdir -p reports/coverage reports/junit reports/logs
    - pytest backend --cov=backend --cov-report=xml:reports/coverage/coverage.xml --cov-fail-under=${COVERAGE_FAIL_UNDER} --junitxml=reports/junit/backend_coverage.xml -q 2>&1 | tee reports/logs/backend_coverage.log
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - reports/coverage/coverage.xml
      - reports/logs/backend_coverage.log
    reports:
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage/coverage.xml
  only:
    - main

tests-frontend:
  image: node:18
  stage: test
  script:
    - cd frontend
    - npm ci
    - npm run lint --if-present || true
    - mkdir -p ../reports/logs
    - npm test --if-present 2>&1 | tee ../reports/logs/frontend_test.log || true
    - npm run build --if-present || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - reports/logs/frontend_test.log

build-and-push:
  image: docker:24
  stage: build
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY || true
  script:
    - echo "Building backend image"
    - docker build -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" -f docker/backend/Dockerfile . || true
    - docker tag "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE/backend:latest" || true
    - echo "Building frontend image"
    - docker build -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA" -f docker/frontend/Dockerfile . || true
    - docker tag "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE/frontend:latest" || true
  only:
    - main
  after_script:
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" || true
    - docker push "$CI_REGISTRY_IMAGE/backend:latest" || true
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA" || true
    - docker push "$CI_REGISTRY_IMAGE/frontend:latest" || true

deploy:
  image: alpine:latest
  stage: deploy
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts || true
  script:
    - ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "cd $DEPLOY_PATH && docker-compose pull && docker-compose up -d --build"
  only:
    - main
